<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zz的个人主页</title>

      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: 100%; max-width: 640px; padding: 40px; background: #fff;
      border: 1px solid #e5e7eb; border-radius: 16px;

    .avatar { width: 96px; height: 96px; border-radius: 50%; }
    h1 { margin: 16px 0 4px; font-size: 28px; }
    .title { margin: 0 0 20px; color: #6b7280; }
    p { line-height: 1.7; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }
    .links a {
      padding: 8px 16px; border-radius: 999px; background: #1f2328;
      color: #fff; font-size: 14px; text-decoration: none;
    }
    .links a:hover { background: #3f4650; }
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="https://github.com/zhangsan.png" alt="头像">
    <h1></h1>

      <a href="https://github.com/zhangsan">GitHub</a>

</html>
